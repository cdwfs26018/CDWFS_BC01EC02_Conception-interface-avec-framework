<app-header></app-header>
<main class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Titre -->
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
      Connexion
    </h1>

    <!-- Formulaire -->
    <form
      (ngSubmit)="loginSite()"
      class="space-y-6"
    >
      <!-- Username -->
      <div>
        <label
          for="username"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Utilisateur
        </label>
        <input
          id="username"
          type="text"
          [(ngModel)]="username"
          name="username"
          required
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          placeholder="email@exemple.com"
        />
      </div>

      <!-- Password -->
      <div>
        <label
          for="password"
          class="block text-sm font-medium text-gray-700 mb-1"
        >
          Mot de passe
        </label>
        <input
          id="password"
          type="password"
          [(ngModel)]="password"
          name="password"
          required
          class="w-full px-4 py-3 border rounded-lg focus:outline-none focus:ring-2 focus:ring-orange-500"
          placeholder="••••••••"
        />
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition duration-200"
      >
        Se connecter
      </button>
    </form>

    <!-- Info -->
    <p class="text-xs text-center text-gray-400 mt-6">
      Connexion sécurisée – borne de commande
    </p>
  </div>
</main>
