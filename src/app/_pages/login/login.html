
<main class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <h1 class="text-3xl font-bold text-center mb-8">Connexion</h1>

    <form (ngSubmit)="submit()" class="space-y-6">

      <input
        [(ngModel)]="email"
        name="email"
        type="email"
        placeholder="email@exemple.com"
        required
        class="w-full px-4 py-3 border rounded-lg"
      />

      <input
        [(ngModel)]="password"
        name="password"
        type="password"
        placeholder="••••••••"
        required
        class="w-full px-4 py-3 border rounded-lg"
      />

      <button
        type="submit"
        class="w-full bg-orange-500 text-white py-3 rounded-lg"
      >
        Se connecter
      </button>

    </form>

    <p class="text-center text-sm mt-4">
      Pas encore de compte ?
      <a routerLink="/register" class="text-orange-500 font-semibold">
        Inscription
      </a>
    </p>

  </div>
</main>
