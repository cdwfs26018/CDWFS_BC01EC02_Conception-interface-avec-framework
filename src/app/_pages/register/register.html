
<main class="min-h-screen flex items-center justify-center bg-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <!-- Titre -->
    <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">
      Création de compte
    </h1>

    <!-- Formulaire -->
    <form (ngSubmit)="submit()" class="space-y-5">

      <!-- Prénom -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Prénom
        </label>
        <input
          type="text"
          name="firstName"
          [(ngModel)]="user.firstName"
          required
          class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500"
        />
      </div>

      <!-- Nom -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Nom
        </label>
        <input
          type="text"
          name="lastName"
          [(ngModel)]="user.lastName"
          required
          class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500"
        />
      </div>

      <!-- Email -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          name="email"
          [(ngModel)]="user.email"
          required
          class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500"
        />
      </div>

      <!-- Mot de passe -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Mot de passe
        </label>
        <input
          type="password"
          name="password"
          [(ngModel)]="user.password"
          required
          minlength="6"
          class="w-full px-4 py-3 border rounded-lg focus:ring-2 focus:ring-orange-500"
        />
      </div>

      <!-- Bouton -->
      <button
        type="submit"
        class="w-full bg-orange-500 hover:bg-orange-600 text-white font-semibold py-3 rounded-lg transition"
      >
        Créer mon compte
      </button>

    </form>

    <!-- Lien login -->
    <p class="text-sm text-center text-gray-500 mt-6">
      Déjà un compte ?
      <a
        routerLink="/login"
        class="text-orange-500 font-semibold hover:underline"
      >
        Se connecter
      </a>
    </p>

  </div>
</main>
